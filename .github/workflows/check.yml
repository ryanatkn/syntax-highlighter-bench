# Checks and builds the project, checks that the committed deterministic results
# still regenerate, and runs every library on every cell and cold-start scenario
# once. For more info:
# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions
#
# Nothing here is a measurement: the timed numbers come from one named machine.
# Every step after `npm ci` runs offline, on the corpus committed in the repo.

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # Allow manually re-running the check from the Actions tab.
  workflow_dispatch:

# Cancel a PR's in-progress run when a new commit supersedes it; let main-branch
# runs finish so every commit on main stays verified.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the check only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: ['24.14']

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config, so a
      # compromised build dependency can't read it. If you add a step that pushes
      # via git (deploy, tag, generated commit), set this back to true or
      # authenticate that step explicitly.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx @fuzdev/gro check --workspace --build
      # Rebuilds every bundle and recounts every input, and fails if
      # results/deterministic.json differs. The gzip and brotli sizes depend on the
      # zlib and brotli inside Node, so the file is generated on this Node version.
      - run: npm run bench:deterministic -- --check
      # Every library on every cell and in every cold-start scenario, one process
      # each, several at a time. Each process's token count and output size must
      # agree with the deterministic file. It runs after the check above, so the
      # bundles its cold-start processes import are already built.
      - run: npm run bench:smoke
